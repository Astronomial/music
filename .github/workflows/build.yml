name: Check and build Forma
on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**', 'artifacts/**', '**.md', 'ios/**', '.github/workflows/ios.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify the actual neural audio model in the production worker
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/forma-semantic-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4179/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/semantic-audio-smoke.mjs
      - name: Check UI, native AAC decoding and reviewed Wi-Fi sync
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/forma-vite.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
  windows:
    permissions:
      contents: write
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-Windows-x64
          path: release/Forma-*-Windows-x64.exe
          if-no-files-found: error
      - name: Check native audio, background playback and confirmed Wi-Fi sync
        run: npm run test:desktop
      - name: Check playback from the packaged Windows EXE
        env:
          FORMA_ELECTRON_PATH: release/win-unpacked/Forma.exe
          FORMA_PACKAGED_TEST: '1'
        run: node tests/desktop-smoke.mjs
      - name: Publish Windows download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "release/Forma-$version-Windows-x64.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Forma-$version-Windows-x64.exe" | Set-Content -Encoding ascii release/Forma-Windows-SHA256SUMS.txt
          $tag = "win-v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe release/Forma-Windows-SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $exe release/Forma-Windows-SHA256SUMS.txt --target $env:GITHUB_SHA --title "Forma $version Windows" --notes-file docs/WINDOWS_RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
