name: Check and build Forma
on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**', 'artifacts/**', '**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check UI, native AAC decoding and Google settings
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run dev > "$RUNNER_TEMP/forma-vite.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Forma-Windows-x64
          path: release/Forma-*-Windows-x64.exe
          if-no-files-found: error
